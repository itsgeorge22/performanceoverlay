name: Minecraft client tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  client-test:
    name: Minecraft ${{ matrix.minecraft }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - minecraft: 1.21.9
            java: "21"
            command: ./gradlew test12109 --stacktrace
          - minecraft: 1.21.10
            java: "21"
            command: ./gradlew test12110 --stacktrace
          - minecraft: 1.21.11
            java: "21"
            command: ./gradlew test12111 --stacktrace
          - minecraft: 26.1
            java: "25"
            command: bash ./versions/26.1.2/gradlew -p versions/26.1.2 test261 --stacktrace
          - minecraft: 26.1.1
            java: "25"
            command: bash ./versions/26.1.2/gradlew -p versions/26.1.2 test2611 --stacktrace
          - minecraft: 26.1.2
            java: "25"
            command: bash ./versions/26.1.2/gradlew -p versions/26.1.2 test2612 --stacktrace
          - minecraft: 26.2
            java: "25"
            command: bash ./versions/26.2/gradlew -p versions/26.2 test262 --stacktrace

    env:
      LIBGL_ALWAYS_SOFTWARE: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrappers
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic

      - name: Make Gradle wrappers executable
        run: chmod +x ./gradlew ./versions/26.1.2/gradlew ./versions/26.2/gradlew

      - name: Run Minecraft ${{ matrix.minecraft }} client tests
        run: |
          for attempt in 1 2; do
            if xvfb-run --auto-servernum --server-args="-screen 0 1280x720x24" ${{ matrix.command }}; then
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "::warning::Client test failed once; retrying to tolerate transient virtual-runner world-loading delays."
            fi
          done
          exit 1

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: minecraft-${{ matrix.minecraft }}-failure-evidence
          if-no-files-found: ignore
          retention-days: 7
          path: |
            **/build/run/clientGameTest/logs/**
            **/build/run/clientGameTest/crash-reports/**
            **/build/run/clientGameTest/screenshots/**
            **/build/run/clientGameTest/config/performanceoverlay/benchmarks/**
