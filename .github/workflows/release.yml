name: Release (build on tag)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  client-tests:
    uses: ./.github/workflows/client-tests.yml

  build:
    needs: client-tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Build
        run: ./gradlew clean build

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Build Minecraft 26.1–26.1.2 JAR
        run: bash ./versions/26.1.2/gradlew -p versions/26.1.2 clean build

      - name: Build Minecraft 26.2 JAR
        run: bash ./versions/26.2/gradlew -p versions/26.2 clean build

      - name: Collect release jars
        shell: bash
        run: |
          set -e
          mkdir -p release-artifacts
          find build/libs versions/26.1.2/build/libs versions/26.2/build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' -exec cp {} release-artifacts/ \;
          if [ "$(find release-artifacts -maxdepth 1 -type f -name '*.jar' | wc -l)" -ne 3 ]; then
            echo "Expected exactly three release jars"
            find release-artifacts -maxdepth 1 -type f -print
            exit 1
          fi

      - name: Create GitHub Release and upload jars
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*.jar
          generate_release_notes: true
