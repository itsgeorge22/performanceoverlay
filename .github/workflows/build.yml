# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build-java-21:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Java-21-artifacts
          path: build/libs/

  build-java-25:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        include:
          - target: 26.1.2
            artifact: 26.1-26.1.2
          - target: 26.2
            artifact: 26.2
    steps:
      - name: checkout repository
        uses: actions/checkout@v7
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
      - name: build Java 25 JAR
        run: bash ./versions/${{ matrix.target }}/gradlew -p versions/${{ matrix.target }} build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Java-25-${{ matrix.artifact }}-artifacts
          path: versions/${{ matrix.target }}/build/libs/
