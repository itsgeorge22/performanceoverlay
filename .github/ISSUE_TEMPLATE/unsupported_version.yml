name: Unsupported version / setup
description: For wrong Minecraft version, missing dependencies, or non-Fabric loaders.
title: "[Unsupported] "
labels: ["invalid"]
body:
  - type: markdown
    attributes:
      value: |
        Performance Overlay supports:
        - **Minecraft 1.21.9–1.21.11** with the matching Java 21 JAR
        - **Minecraft 26.1–26.1.2** with the matching Java 25 JAR
        - **Minecraft 26.2** with its separate Java 25 JAR
        - **Loader: Fabric**
        - Requires: **Fabric API**, **Cloth Config**

        If you're not on that setup, this issue will be closed.

  - type: input
    id: mc
    attributes:
      label: Minecraft version
