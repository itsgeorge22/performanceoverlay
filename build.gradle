plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

def mcMajorMinor = "1.21.9-1.21.11"
def jarBase = "performanceoverlay-${project.mod_version}+mc${mcMajorMinor}-fabric"

base {
    archivesName = jarBase
}

tasks.named("remapJar").configure {
    archiveFileName = "${jarBase}.jar"
}

repositories {
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
    }
	maven {
        name = "Architectury"
        url = "https://maven.architectury.dev/"
    }
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"performanceoverlay" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}

}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "performanceoverlay-client-tests"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}

apply from: file('gradle/client-test-environment.gradle')

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	
	modClientCompileOnly  "maven.modrinth:modmenu:${project.modmenu_version}"
	modClientRuntimeOnly  "maven.modrinth:modmenu:${project.modmenu_version}"
	
	modClientCompileOnly  "maven.modrinth:cloth-config:${project.cloth_config_version}"
	modClientRuntimeOnly  "maven.modrinth:cloth-config:${project.cloth_config_version}"
	
	modClientRuntimeOnly  "maven.modrinth:placeholder-api:${project.placeholder_api_version}"

	modClientRuntimeOnly "me.shedaniel.cloth:basic-math:${project.basic_math_version}"

	testImplementation sourceSets.client.output
	testImplementation platform("org.junit:junit-bom:5.13.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}

tasks.named("test", Test).configure {
	useJUnitPlatform()
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

tasks.matching { it.name == "sourcesJar" }.configureEach {
    archiveFileName = "${jarBase}-sources.jar"
}

tasks.matching { it.name == "remapSourcesJar" }.configureEach {
    archiveFileName = "${jarBase}-sources.jar"
}


jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}

def compatibilityTargets = [
        '12109': [
                minecraft: '1.21.9',
                fabricApi: '0.134.1+1.21.9',
                modMenu: '16.0.1',
                clothConfig: '20.0.149+fabric',
                placeholderApi: '2.8.0+1.21.9'
        ],
        '12110': [
                minecraft: '1.21.10',
                fabricApi: '0.138.4+1.21.10',
                modMenu: '16.0.1',
                clothConfig: '20.0.149+fabric',
                placeholderApi: '2.8.0+1.21.9'
        ]
]

def compatibilityWrapper = System.getProperty('os.name').toLowerCase().contains('windows')
		? ['cmd', '/d', '/c', file('gradlew.bat').absolutePath]
		: [file('gradlew').absolutePath]

compatibilityTargets.each { suffix, target ->
    tasks.register("test${suffix}", Exec) {
        group = 'verification'
        description = "Build the release JAR and run client compatibility tests on Minecraft ${target.minecraft}."
        dependsOn project.tasks.named('remapJar')
        workingDir project.projectDir
        commandLine compatibilityWrapper + [
				'-p', file('compatibility').absolutePath,
				'runClientGameTest',
				"-Ptarget_minecraft=${target.minecraft}",
				"-Ptarget_fabric_api=${target.fabricApi}",
				"-Ptarget_modmenu=${target.modMenu}",
				"-Ptarget_cloth_config=${target.clothConfig}",
				"-Ptarget_placeholder_api=${target.placeholderApi}",
				"-Pperformance_overlay_jar=${project.tasks.named('remapJar').get().archiveFile.get().asFile.absolutePath}"
		]
    }
}

tasks.register('test12111') {
    group = 'verification'
    description = 'Run the complete Minecraft 1.21.11 unit and client integration suite.'
    dependsOn tasks.named('test'), tasks.named('runClientGameTest')
}

tasks.named('test12110') {
	mustRunAfter project.tasks.named('test12109')
}

tasks.named('test12111') {
	mustRunAfter project.tasks.named('test12110')
}

tasks.register('testSupportedVersions') {
    group = 'verification'
    description = 'Run compatibility tests for every Minecraft version declared by all release JARs.'
    dependsOn tasks.named('test12109'), tasks.named('test12110'), tasks.named('test12111'), tasks.named('test261SupportedVersions'), tasks.named('test262SupportedVersion')
}

def modernWrapper = System.getProperty('os.name').toLowerCase().contains('windows')
		? ['cmd', '/d', '/c', file('versions/26.1.2/gradlew.bat').absolutePath]
		: ['bash', file('versions/26.1.2/gradlew').absolutePath]

tasks.register('test261SupportedVersions', Exec) {
	group = 'verification'
	description = 'Build and test the 26.1 JAR on Minecraft 26.1, 26.1.1, and 26.1.2.'
	workingDir project.projectDir
	commandLine modernWrapper + [
			'-p', file('versions/26.1.2').absolutePath,
			'testSupportedVersions'
	]
	mustRunAfter tasks.named('test12111')
}

def minecraft262Wrapper = System.getProperty('os.name').toLowerCase().contains('windows')
		? ['cmd', '/d', '/c', file('versions/26.2/gradlew.bat').absolutePath]
		: ['bash', file('versions/26.2/gradlew').absolutePath]

tasks.register('test262SupportedVersion', Exec) {
	group = 'verification'
	description = 'Build and test the separate Minecraft 26.2 JAR.'
	workingDir project.projectDir
	commandLine minecraft262Wrapper + [
			'-p', file('versions/26.2').absolutePath,
			'testSupportedVersions'
	]
	mustRunAfter tasks.named('test261SupportedVersions')
}
